spring.datasource.url=jdbc:postgresql://localhost:5432/Timetable_db
spring.datasource.username=postgres
spring.datasource.password=system
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
spring.application.name=timetable-generator

# Genetic Algorithm tuning
ga.population.size=100
ga.max.generations=500
ga.mutation.rate=0.05
ga.crossover.rate=0.80
ga.elite.count=5
ga.tournament.size=5

logging.level.com.itdept=INFO